# GitHub topic / 主语言 → 领域 path 的规则映射 v3（对应 taxonomy.yaml version 3）
# 命中即归类（免费、确定性），多命中 = 多标签。key 全小写。
# ─────────────────────────────────────────────────────────────
# v3 相对 v2：
#   · 目标路径全部换成 v3 叶子
#   · 删 cli / command-line：形态词，facets.yaml 已管；terminal/tui/zsh 归 devtools/terminal
#   · 新增 agents/* 五组信号（mcp、claude-code、agent-skills、langchain、rag …）
#   · 新增 client/* 的"库"信号（swiftui、cocoapods、jetpack-compose …）；
#     沿用 v2 教训，不加 android / ios / linux 这类平台词（它们表示"跑在什么上"，误判率高）
#   · lang/utils 的 algorithms / serialization 改落新叶子
#   · apps 规则只指向货架叶子（apps/<大类>/<货架>），不再指向大类

