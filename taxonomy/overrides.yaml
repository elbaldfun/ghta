# StarRank 人工修正表 —— 模型判错、人已经裁决过的条目
# ─────────────────────────────────────────────────────────────
# 用途：每晚 overrides 任务（在 judge 之后、rank 之前）把这里的形态、领域、货架写回条目；
#       judge 已判过的条目同时标 labels.by=manual，之后不再重判；还没判过的照常排队补齐 tagline 等，
#       判完当晚再被改回来。改这里、发版即生效；生产库不手改。
# 字段：
#   id     GitHub 仓库 owner/name
#   type   形态，facets.yaml 的 key 之一（library/app/cli/software/tutorial/awesome/interview/skill）
#   paths  领域叶子，最相关的在前；货架的叶子由 shelf 自动补上，不要重复写。
#          apps 叶子只在 golden 标了两个货架时作第二标签用（不会让条目上第二个货架）
#   shelf  货架 slug、开发者货架（judge.DevShelves）或 excluded；资料类必须是 excluded，
#          上货架的必须是 app 或 cli
#   why    裁决理由，引用 golden 的 Qx 或分类树的叶子说明
# 校验：go test ./internal/judge —— 路径是当前树的叶子、货架存在、golden 里有的条目必须与 golden 一致。
# 删掉一条不会把条目交回模型；要重判，在 golden 或这里改成正确答案。
# 同一任务还执行一条规则（judge.ClientBranch）：上了应用货架的条目去掉 client/* 叶子——
# client 是"客户端开发库与工具"，装来用的应用不是；开发者货架上的（如 termux）不动。
#
# 2026-11-22 首选复核：所有货架页与领域页的首选（第 1 名）逐条看过，下面是判错的；
# golden 里有的条目照 golden 改（形态、第二标签），没有的按分类树叶子说明裁决。

