name: CI

# Every pull request is built and tested: the Go backend (build-test) and the
# Next.js frontend (web). Work PRs land on develop; main only moves through
# the develop → main release PR (scripts/release.sh promote), and the
# release-source job fails any PR into main from another branch. Rules:
# docs/BRANCHING_AND_RELEASE.md.
#
# A PR into develop is merged automatically once both jobs pass. To keep one
# open, mark it as a draft or add the `hold` label; remove either and CI runs
# again and merges. Not merged automatically: PRs from forks, PRs that change
# files under .github/workflows (GitHub refuses that to the workflow token),
# and release PRs into main — merging one is the decision to release.
#
# Merging does not deploy. Releases stay manual: scripts/release.sh.

on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-source:
    name: release-source
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Release PRs come from develop
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REF" != develop ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::PRs into main must come from develop of this repository (got '$HEAD_REPO:$HEAD_REF'). Open the PR against develop; a hotfix goes the same way, then scripts/release.sh promote."
            exit 1
          fi

  build-test:
    name: build-test
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGODB_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Format
        run: test -z "$(gofmt -l cmd internal pkg)" || { gofmt -l cmd internal pkg; exit 1; }
      - name: Release script syntax
        run: bash -n scripts/release.sh
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./... -count=1

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Layout guard
        run: npm run lint:layout
      - name: Unit tests
        run: npm test

  automerge:
    name: auto-merge
    needs: [build-test, web]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) &&
      !contains(github.event.pull_request.labels.*.name, 'hold')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      # --match-head-commit: merge exactly the commit that was tested. A push
      # that lands while this job is starting makes the merge fail, and the new
      # commit gets its own run.
      - name: Merge
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if gh pr diff "$PR" --name-only | grep -q '^\.github/workflows/'; then
            echo "::notice::This PR changes a workflow file; the workflow token may not merge it. Merge it by hand."
            exit 0
          fi
          gh pr merge "$PR" --merge --match-head-commit "$SHA"
