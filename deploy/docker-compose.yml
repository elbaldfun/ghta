# Production stack for the starrank.dev droplet (1 vCPU / 2 GB RAM).
#
# Nothing here publishes ports. Public traffic enters through the droplet's
# shared Caddy, which is a separate compose project (droplet-edge repo,
# /opt/edge) because other sites live on this box too. `web` and `api` join its
# external `edge` network; MongoDB stays on the internal compose network only —
# the database must never be exposed to the internet.
#
# Secrets come from deploy/.env on the server (gitignored, never committed).

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # WiredTiger would otherwise size its cache from total RAM and leave nothing
    # for the API on a 2 GB box. 0.5 GB keeps the working set cached with room
    # to spare; the rest of the 1.6 GB dataset is served from disk.
    #
    # The tcmalloc flags matter just as much as the cache size: after a burst
    # the allocator kept ~850 MB of freed pages (and may keep up to 1 GB of
    # per-thread caches by default) instead of returning them, which is what
    # pushed the container into its limit and got mongod OOM-killed.
    command:
      - mongod
      - --wiredTigerCacheSizeGB=0.5
      - --setParameter=tcmallocAggressiveMemoryDecommit=1
      - --setParameter=tcmallocMaxTotalThreadCacheBytes=134217728
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    # No `ports:` on purpose — internal network access only.
    mem_limit: 1g
    healthcheck:
      # A TCP connect, not `mongosh ping`: mongosh is a ~100 MB Node process
      # charged to this container's memory limit every 30s, and was itself
      # OOM-killed here. mongod only accepts connections once recovery is done.
      test: ["CMD-SHELL", "timeout 3 bash -c ':> /dev/tcp/127.0.0.1/27017'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    image: ghta-api:latest
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: "3000"
      LOG_LEVEL: info
      MONGODB_DB: ghta
      MONGODB_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/ghta?authSource=admin
      GITHUB_API_TOKEN: ${GITHUB_API_TOKEN}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # LLM backend (change 12: grok relay) + classification tuning.
      LMSTUDIO_BASE_URL: ${LMSTUDIO_BASE_URL:-}
      LMSTUDIO_LOCAL_MODULE_NAME: ${LMSTUDIO_LOCAL_MODULE_NAME:-}
      LMSTUDIO_API_KEY: ${LMSTUDIO_API_KEY:-}
      CATEGORIZE_BATCH_SIZE: ${CATEGORIZE_BATCH_SIZE:-15}
      DOMAIN_MAX_LABELS: ${DOMAIN_MAX_LABELS:-3}
      LLM_CONCURRENCY: ${LLM_CONCURRENCY:-1}
      EMBED_MODEL: ${EMBED_MODEL:-}
    # The grok relay's DNS resolves to a CN CDN edge that 504s from this US
    # droplet; pin it to a working origin IP (override via LLM_RELAY_HOST_PIN).
    extra_hosts:
      - ${LLM_RELAY_HOST_PIN:-dragoncode.codes:192.238.249.146}
    # No `ports:` — traffic arrives through Caddy.
    networks:
      default:
      edge:
        aliases: [ghta-api]
    mem_limit: 640m

  web:
    image: ghta-web:latest
    restart: unless-stopped
    depends_on: [api]
    environment:
      # Container-to-container at runtime: SSR/ISR fetches skip Caddy and TLS.
      # The prefixed alias, not `api`: on the shared edge network a bare
      # service name could resolve to another project's container.
      API_URL: http://ghta-api:3000
      NEXT_PUBLIC_SITE_URL: https://starrank.dev
      PORT: "3000"
    # No `ports:` — traffic arrives through Caddy.
    networks:
      default:
      edge:
        aliases: [ghta-web]
    mem_limit: 512m

volumes:
  mongo_data:

networks:
  # Owned by droplet-edge; exists before this project starts. The aliases are
  # project-prefixed because the network is shared with other sites.
  edge:
    external: true
